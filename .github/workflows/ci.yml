name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (lightweight, no model downloads)
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest -q
      - name: Retrieval eval on golden set (offline hashing embeddings)
        run: |
          rag-pdf-qa --embedding-backend hash ingest data/meridian_mutual_fy2026_full_report.pdf
          RAG_SEARCH_TYPE=similarity rag-pdf-qa --embedding-backend hash eval eval/golden_meridian.jsonl -k 4
